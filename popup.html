<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 220px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 12px;
      background-color: #f9f9f9;
      color: #333;
    }
    h3 {
      margin: 0 0 4px 0;
      font-size: 14px;
      color: #111;
    }
    p {
      margin: 0 0 12px 0;
      font-size: 11px;
      color: #666;
    }
    .status-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fff;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #e5e5e5;
    }
    .status-text {
      font-size: 12px;
      font-weight: 500;
    }
    /* Simple Toggle Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 34px;
      height: 20px;
    }
    .switch input { 
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ccc;
      transition: .2s;
      border-radius: 20px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .2s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #007bff;
    }
    input:checked + .slider:before {
      transform: translateX(14px);
    }
  </style>
</head>
<body>
  <h3>Web Culler</h3>
  <p id="domain-text">Detecting site...</p>
  
  <div class="status-container">
    <span class="status-text">Enable on this site</span>
    <label class="switch">
      <input type="checkbox" id="toggle-cull" checked>
      <span class="slider"></span>
    </label>
  </div>

  <script src="popup.js"></script>
</body>
</html>
